services:
  mongo:
    image: mongo:7
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval 'try { db.hello().isWritablePrimary } catch (e) { quit(1) }' | grep -q true"]
      interval: 10s
      timeout: 5s
      retries: 5

  mongo-init:
    image: mongo:7
    restart: "no"
    depends_on:
      - mongo
    command:
      - sh
      - -lc
      - |
        for i in $$(seq 1 60); do
          if mongosh --host mongo --quiet --eval 'try { rs.status().ok } catch (e) { rs.initiate({_id:"rs0", members:[{_id:0, host:"mongo:27017"}]}) }' >/dev/null 2>&1; then
            for j in $$(seq 1 60); do
              if mongosh --host mongo --quiet --eval 'db.hello().isWritablePrimary' | grep -q true; then
                exit 0
              fi
              sleep 1
            done
            exit 1
          fi
          sleep 2
        done
        exit 1

  # Self-hosted, S3-compatible object storage for file uploads. Fully
  # air-gapped: nothing leaves the Docker network at runtime.
  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-echo}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:-echo-dev-secret}
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  rhsso:
    image: quay.io/keycloak/keycloak:26.7.0
    restart: unless-stopped
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: AdminPassword1
      KC_HOSTNAME: http://${ECHO_PUBLIC_HOST:-localhost}:8180
    ports:
      - "8180:8080"
    volumes:
      - ./docker/rhsso/echo-realm.json:/opt/keycloak/data/import/echo-realm.json:ro
      - rhsso-keycloak-data:/opt/keycloak/data

  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    # Keep this service scalable with `docker-compose up --scale server=3`.
    # A fixed container_name would prevent Compose from creating replicas.
    restart: unless-stopped
    environment:
      - PORT=4000
      - METRICS_PORT=8091
      - MONGO_URI=${MONGO_URI:-mongodb://mongo:27017/echo?replicaSet=rs0}
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET env var must be set}
      - CLIENT_ORIGIN=http://localhost:8090
      - S3_ENDPOINT=http://minio:9000
      - S3_ACCESS_KEY=${MINIO_ROOT_USER:-echo}
      - S3_SECRET_KEY=${MINIO_ROOT_PASSWORD:-echo-dev-secret}
      - S3_BUCKET=echo-uploads
      - RHSSO_ENABLED=true
      - RHSSO_URL=http://${ECHO_PUBLIC_HOST:-localhost}:8180
      - RHSSO_BACKCHANNEL_URL=http://rhsso:8080
      - RHSSO_REALM=echo
      - RHSSO_CLIENT_ID=echo
      - RHSSO_USERNAME_CLAIM=preferred_username
      - RHSSO_DISPLAY_NAME_CLAIM=name
      - RHSSO_ALLOWED_CLIENT_ORIGINS=http://localhost:8090,http://127.0.0.1:8090,http://${ECHO_PUBLIC_HOST:-localhost}:8090
    depends_on:
      mongo:
        condition: service_healthy
      mongo-init:
        condition: service_completed_successfully
      minio:
        condition: service_healthy
      rhsso:
        condition: service_started

  client:
    build: ./client
    container_name: echo-client
    restart: unless-stopped
    ports:
      - "8090:8080"
    depends_on:
      - server

volumes:
  mongo-data:
  minio-data:
  rhsso-keycloak-data:
