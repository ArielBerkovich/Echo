name: Verify

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  helm:
    name: Helm chart
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Validate chart
        run: |
          helm dependency list ./helm/echo
          helm lint ./helm/echo --strict
          helm lint ./helm/echo --strict \
            --values ./helm/echo/values-openshift.yaml

          helm template echo ./helm/echo \
            --namespace echo \
            --kube-version 1.30.0 \
            > /tmp/echo-kubernetes.yaml
          helm template echo ./helm/echo \
            --namespace echo \
            --kube-version 1.30.0 \
            --api-versions route.openshift.io/v1/Route \
            --values ./helm/echo/values-openshift.yaml \
            > /tmp/echo-openshift.yaml

          test -s /tmp/echo-kubernetes.yaml
          test -s /tmp/echo-openshift.yaml

  unit:
    name: Unit
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            client/package-lock.json

      - name: Install server dependencies
        working-directory: server
        run: npm ci

      - name: Install client dependencies
        working-directory: client
        run: npm ci

      - name: Run server unit tests
        working-directory: server
        run: npm test

      - name: Run client unit tests
        working-directory: client
        run: npm test

  compile:
    name: Compile
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            client/package-lock.json

      - name: Install server dependencies
        working-directory: server
        run: npm ci

      - name: Install client dependencies
        working-directory: client
        run: npm ci

      - name: Build server
        working-directory: server
        run: npm run build

      - name: Build client
        working-directory: client
        run: npm run build

  e2e:
    name: E2E
    runs-on: ubuntu-latest
    needs:
      - unit
      - compile
    services:
      minio:
        image: minio/minio:latest
        ports:
          - 9000:9000
        env:
          MINIO_ROOT_USER: echo
          MINIO_ROOT_PASSWORD: echo-dev-secret
        command: server /data
    defaults:
      run:
        working-directory: client
        shell: bash
    env:
      PORT: 4000
      MONGO_URI: mongodb://127.0.0.1:27017/echo-e2e?replicaSet=rs0
      JWT_SECRET: test-secret
      CLIENT_ORIGIN: http://127.0.0.1:5173
      S3_ENDPOINT: http://127.0.0.1:9000
      S3_ACCESS_KEY: echo
      S3_SECRET_KEY: echo-dev-secret
      S3_BUCKET: echo-uploads
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            client/package-lock.json

      - name: Install server dependencies
        working-directory: server
        run: npm ci

      - name: Install client dependencies
        run: npm ci

      - name: Build server
        working-directory: server
        run: npm run build

      - name: Start transactional MongoDB
        working-directory: .
        run: |
          docker run -d --name echo-e2e-mongo \
            -p 27017:27017 \
            mongo:7 mongod --replSet rs0 --bind_ip_all

          for i in $(seq 1 60); do
            if docker exec echo-e2e-mongo mongosh --quiet --eval \
              'try { rs.status().ok } catch (e) { rs.initiate({_id:"rs0", members:[{_id:0, host:"127.0.0.1:27017"}]}) }' \
              >/dev/null 2>&1; then
              docker exec echo-e2e-mongo mongosh --quiet --eval \
                'db.hello().isWritablePrimary' | grep -q true && break
            fi
            sleep 2
          done

      - name: Start server
        working-directory: server
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:9000/minio/health/live >/dev/null; then
              break
            fi
            sleep 2
          done

          npm start > /tmp/echo-server.log 2>&1 &
          echo $! > /tmp/echo-server.pid

          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:4000/api/health >/dev/null; then
              exit 0
            fi
            sleep 2
          done

          cat /tmp/echo-server.log
          exit 1

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('client/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        env:
          E2E_WORKERS: 2
        run: npm run test:e2e

  e2e-rhsso:
    name: E2E (RHSSO)
    runs-on: ubuntu-latest
    needs:
      - unit
      - compile
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install client dependencies
        working-directory: client
        run: npm ci

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('client/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Playwright browser
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        working-directory: client
        run: npx playwright install --with-deps chromium

      - name: Start Echo with RHSSO enabled
        run: |
          docker compose -p echo-rhsso-ci -f docker-compose.rhsso.yml up -d --build

          for i in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:8091/api/health >/dev/null &&
               curl -fsS http://127.0.0.1:8180/realms/echo/.well-known/openid-configuration >/dev/null; then
              break
            fi
            sleep 2
          done

          curl -fsS -X POST http://127.0.0.1:8091/api/auth/register \
            -H 'Content-Type: application/json' \
            --data '{"username":"admin","password":"Password1"}'

          curl -fsS http://127.0.0.1:8091/api/auth/setup-status |
            grep -q '"rhssoEnabled":true'

      - name: Run real RHSSO E2E tests
        working-directory: client
        env:
          ECHO_URL: http://localhost:8091
        run: npm run test:e2e:rhsso

      - name: Show RHSSO stack logs on failure
        if: failure()
        run: docker compose -p echo-rhsso-ci -f docker-compose.rhsso.yml logs --no-color

      - name: Stop RHSSO stack
        if: always()
        run: docker compose -p echo-rhsso-ci -f docker-compose.rhsso.yml down -v
