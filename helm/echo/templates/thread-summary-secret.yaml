{{- $settings := .Values.server.threadSummaries -}}
{{- if $settings.apiKey -}}
{{- $secretName := required "server.threadSummaries.apiKeySecret is required when apiKey is supplied" $settings.apiKeySecret -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $secretName -}}
{{- if not $existing }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName | quote }}
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "echo.labels" . | nindent 4 }}
    app.kubernetes.io/component: server
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-10"
type: Opaque
stringData:
  {{ required "server.threadSummaries.apiKeySecretKey is required when creating the API key Secret" $settings.apiKeySecretKey | quote }}: {{ $settings.apiKey | quote }}
{{- end }}
{{- end }}
